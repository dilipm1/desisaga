<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diwaliGold" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stopColor="#D4A017"/>
      <stop offset="0.5" stopColor="#F59E0B"/>
      <stop offset="1" stopColor="#EA580C"/>
    </linearGradient>
    <linearGradient id="brassGold" x1="0" y1="0" x2="0" y2="1">
      <stop stopColor="#D4A017"/>
      <stop offset="1" stopColor="#B8860B"/>
    </linearGradient>
    <linearGradient id="deepRed" x1="0" y1="0" x2="0" y2="1">
      <stop stopColor="#7F1D1D"/>
      <stop offset="1" stopColor="#991B1B"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop stopColor="#FEF3C7" stopOpacity="0.8"/>
      <stop offset="1" stopColor="#D4A017" stopOpacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#diwaliGold)" opacity="0.06"/>
  
  <!-- Rangoli background -->
  <g opacity="0.12" transform="translate(200, 200)">
    <circle cx="0" cy="0" r="160" stroke="#D4A017" stroke-width="0.5" fill="none"/>
    <circle cx="0" cy="0" r="130" stroke="#D4A017" stroke-width="0.3" fill="none"/>
    <circle cx="0" cy="0" r="90" stroke="#D4A017" stroke-width="0.4" fill="none"/>
    <g fill="#D4A017" opacity="0.3">
      <circle cx="0" cy="130" r="3"/><circle cx="0" cy="-130" r="3"/>
      <circle cx="130" cy="0" r="3"/><circle cx="-130" cy="0" r="3"/>
      <circle cx="92" cy="92" r="3"/><circle cx="-92" cy="92" r="3"/>
      <circle cx="92" cy="-92" r="3"/><circle cx="-92" cy="-92" r="3"/>
    </g>
  </g>
  
  <!-- Main Diwali Hamper Box -->
  <g transform="translate(200, 280)">
    <!-- Box shadow -->
    <ellipse cx="0" cy="22" rx="100" ry="12" fill="#000" opacity="0.1"/>
    
    <!-- Box base -->
    <path d="M-110 0 L-110 -90 L110 -90 L110 0 Z" fill="url(#deepRed)"/>
    <path d="M-110 -90 L-110 0 L-90 0 L-90 -90 Z" fill="#7F1D1D" opacity="0.5"/>
    <path d="M110 -90 L110 0 L90 0 L90 -90 Z" fill="#DC2626" opacity="0.3"/>
    
    <!-- Box lid -->
    <path d="M-120 -90 L-10 -100 L10 -100 L120 -90 L110 0 L-110 0 Z" fill="url(#deepRed)"/>
    <path d="M-120 -90 L-10 -100 L-110 0 L-120 0 Z" fill="#7F1D1D" opacity="0.4"/>
    
    <!-- Gold trim -->
    <path d="M-110 -90 L-10 -100 L10 -100 L110 -90" fill="none" stroke="url(#brassGold)" stroke-width="2.5"/>
    <path d="M-10 -100 L-110 0" fill="none" stroke="url(#brassGold)" stroke-width="2.5"/>
    <path d="M10 -100 L110 0" fill="none" stroke="url(#brassGold)" stroke-width="2.5"/>
    
    <!-- Diya pattern on lid -->
    <g fill="url(#brassGold)" opacity="0.85" filter="url(#softGlow)">
      <!-- Central large diya -->
      <g transform="translate(0, -55)">
        <ellipse cx="0" cy="8" rx="16" ry="3" fill="#8B4513" opacity="0.3"/>
        <path d="M-14 5 Q-14 8 0 8 Q14 8 14 5 L12 2 L-12 2 Z" fill="url(#brassGold)"/>
        <ellipse cx="0" cy="2" rx="9" ry="1.5" fill="#CD853F"/>
        <ellipse cx="0" cy="2" rx="7" ry="1" fill="#B8860B" opacity="0.6"/>
        <line x1="0" y1="0" x2="0" y2="-10" stroke="#4A3728" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse cx="0" cy="-14" rx="5" ry="7" fill="#FF6B00" opacity="0.2" filter="url(#softGlow)"/>
        <path d="M0 -20 Q-4 -13 -3 -8 Q3 -8 0 -20Z" fill="#FF8C00"/>
        <path d="M0 -16 Q-2 -11 -1 -8 Q1 -8 0 -16Z" fill="#FFD700"/>
        <ellipse cx="0" cy="-11" rx="0.8" ry="1.5" fill="#FFFACD"/>
      </g>
      
      <!-- Four corner diyas -->
      <g transform="translate(-70, -55) scale(0.7)">
        <ellipse cx="0" cy="8" rx="16" ry="3" fill="#8B4513" opacity="0.3"/>
        <path d="M-14 5 Q-14 8 0 8 Q14 8 14 5 L12 2 L-12 2 Z" fill="url(#brassGold)"/>
        <ellipse cx="0" cy="2" rx="9" ry="1.5" fill="#CD853F"/>
        <ellipse cx="0" cy="2" rx="7" ry="1" fill="#B8860B" opacity="0.6"/>
        <line x1="0" y1="0" x2="0" y2="-10" stroke="#4A3728" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse cx="0" cy="-14" rx="5" ry="7" fill="#FF6B00" opacity="0.2"/>
        <path d="M0 -20 Q-4 -13 -3 -8 Q3 -8 0 -20Z" fill="#FF8C00"/>
        <path d="M0 -16 Q-2 -11 -1 -8 Q1 -8 0 -16Z" fill="#FFD700"/>
      </g>
      <g transform="translate(70, -55) scale(0.7)">
        <ellipse cx="0" cy="8" rx="16" ry="3" fill="#8B4513" opacity="0.3"/>
        <path d="M-14 5 Q-14 8 0 8 Q14 8 14 5 L12 2 L-12 2 Z" fill="url(#brassGold)"/>
        <ellipse cx="0" cy="2" rx="9" ry="1.5" fill="#CD853F"/>
        <ellipse cx="0" cy="2" rx="7" ry="1" fill="#B8860B" opacity="0.6"/>
        <line x1="0" y1="0" x2="0" y2="-10" stroke="#4A3728" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse cx="0" cy="-14" rx="5" ry="7" fill="#FF6B00" opacity="0.2"/>
        <path d="M0 -20 Q-4 -13 -3 -8 Q3 -8 0 -20Z" fill="#FF8C00"/>
        <path d="M0 -16 Q-2 -11 -1 -8 Q1 -8 0 -16Z" fill="#FFD700"/>
      </g>
      <g transform="translate(-70, -80) scale(0.6)">
        <ellipse cx="0" cy="8" rx="16" ry="3" fill="#8B4513" opacity="0.3"/>
        <path d="M-14 5 Q-14 8 0 8 Q14 8 14 5 L12 2 L-12 2 Z" fill="url(#brassGold)"/>
        <ellipse cx="0" cy="2" rx="9" ry="1.5" fill="#CD853F"/>
        <ellipse cx="0" cy="2" rx="7" ry="1" fill="#B8860B" opacity="0.6"/>
        <line x1="0" y1="0" x2="0" y2="-10" stroke="#4A3728" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse cx="0" cy="-14" rx="5" ry="7" fill="#FF6B00" opacity="0.2"/>
        <path d="M0 -20 Q-4 -13 -3 -8 Q3 -8 0 -20Z" fill="#FF8C00"/>
        <path d="M0 -16 Q-2 -11 -1 -8 Q1 -8 0 -16Z" fill="#FFD700"/>
      </g>
      <g transform="translate(70, -80) scale(0.6)">
        <ellipse cx="0" cy="8" rx="16" ry="3" fill="#8B4513" opacity="0.3"/>
        <path d="M-14 5 Q-14 8 0 8 Q14 8 14 5 L12 2 L-12 2 Z" fill="url(#brassGold)"/>
        <ellipse cx="0" cy="2" rx="9" ry="1.5" fill="#CD853F"/>
        <ellipse cx="0" cy="2" rx="7" ry="1" fill="#B8860B" opacity="0.6"/>
        <line x1="0" y1="0" x2="0" y2="-10" stroke="#4A3728" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse cx="0" cy="-14" rx="5" ry="7" fill="#FF6B00" opacity="0.2"/>
        <path d="M0 -20 Q-4 -13 -3 -8 Q3 -8 0 -20Z" fill="#FF8C00"/>
        <path d="M0 -16 Q-2 -11 -1 -8 Q1 -8 0 -16Z" fill="#FFD700"/>
      </g>
    </g>
    
    <!-- Ribbon -->
    <rect x="-8" y="-90" width="16" height="100" fill="url(#brassGold)" opacity="0.95"/>
    <ellipse cx="0" cy="-90" rx="16" ry="8" fill="url(#brassGold)" opacity="0.95"/>
    
    <!-- Bow -->
    <g fill="url(#brassGold)" opacity="0.95">
      <ellipse cx="-22" cy="-95" rx="14" ry="9" transform="rotate(-35 -22 -95)"/>
      <ellipse cx="22" cy="-95" rx="14" ry="9" transform="rotate(35 22 -95)"/>
      <circle cx="0" cy="-95" r="7"/>
      <ellipse cx="-22" cy="-85" rx="8" ry="5" fill="#FEF3C7" opacity="0.6" transform="rotate(-35 -22 -85)"/>
      <ellipse cx="22" cy="-85" rx="8" ry="5" fill="#FEF3C7" opacity="0.6" transform="rotate(35 22 -85)"/>
    </g>
    
    <!-- Side ribbons -->
    <path d="M-18 -90 Q-35 -80 -40 -45 Q-35 -20 -18 -5" fill="none" stroke="url(#brassGold)" stroke-width="3.5" opacity="0.8" stroke-linecap="round"/>
    <path d="M18 -90 Q35 -80 40 -45 Q35 -20 18 -5" fill="none" stroke="url(#brassGold)" stroke-width="3.5" opacity="0.8" stroke-linecap="round"/>
  </g>
  
  <!-- Sweets box -->
  <g transform="translate(80, 120)">
    <ellipse cx="0" cy="12" rx="35" ry="7" fill="#000" opacity="0.1"/>
    <path d="M-40 -25 L-40 12 L40 12 L40 -25 Z" fill="#FEF3C7"/>
    <path d="M-40 -25 L-40 12 L-30 12 L-30 -25 Z" fill="#FDE68A"/>
    <path d="M40 -25 L40 12 L30 12 L30 -25 Z" fill="#FEF3C7" opacity="0.7"/>
    <path d="M-40 -25 L40 -25 L40 -35 L-40 -35 Z" fill="#FEF3C7"/>
    <path d="M-40 -35 L40 -35 L35 -43 L-35 -43 Z" fill="#FDE68A"/>
    
    <!-- Sweets inside -->
    <g fill="#D97706" opacity="0.85">
      <circle cx="-25" cy="-10" r="8"/><circle cx="-5" cy="-10" r="8"/><circle cx="15" cy="-10" r="8"/>
      <circle cx="-25" cy="5" r="8"/><circle cx="-5" cy="5" r="8"/><circle cx="15" cy="5" r="8"/>
    </g>
    <g fill="#FBBF24" opacity="0.5">
      <circle cx="-25" cy="-10" r="4"/><circle cx="-5" cy="-10" r="4"/><circle cx="15" cy="-10" r="4"/>
      <circle cx="-25" cy="5" r="4"/><circle cx="-5" cy="5" r="4"/><circle cx="15" cy="5" r="4"/>
    </g>
    <path d="M-40 -25 L-40 12 L40 12 L40 -25 Z" fill="none" stroke="url(#brassGold)" stroke-width="1.5"/>
    <path d="M-40 -25 L40 -25 L40 -35 L-40 -35 Z" fill="none" stroke="url(#brassGold)" stroke-width="1.5"/>
  </g>
  
  <!-- Rangoli colors box -->
  <g transform="translate(330, 110)">
    <ellipse cx="0" cy="10" rx="28" ry="5" fill="#000" opacity="0.1"/>
    <rect x="-30" y="-20" width="60" height="40" rx="3" fill="#FEF3C7"/>
    <rect x="-28" y="-18" width="56" height="36" rx="2" fill="#1C1917"/>
    
    <!-- Color compartments -->
    <g opacity="0.9">
      <rect x="-25" y="-15" width="16" height="16" rx="2" fill="#DC2626"/><!-- Red -->
      <rect x="-7" y="-15" width="16" height="16" rx="2" fill="#F59E0B"/><!-- Orange -->
      <rect x="11" y="-15" width="16" height="16" rx="2" fill="#EAB308"/><!-- Yellow -->
      <rect x="-25" y="3" width="16" height="16" rx="2" fill="#22C55E"/><!-- Green -->
      <rect x="-7" y="3" width="16" height="16" rx="2" fill="#3B82F6"/><!-- Blue -->
      <rect x="11" y="3" width="16" height="16" rx="2" fill="#A855F7"/><!-- Purple -->
    </g>
    <rect x="-30" y="-20" width="60" height="40" rx="3" fill="none" stroke="url(#brassGold)" stroke-width="1.5"/>
  </g>
  
  <!-- Decorative Diyas around -->
  <g fill="url(#brassGold)">
    <!-- Diya 1 -->
    <g transform="translate(40, 200)">
      <ellipse cx="0" cy="15" rx="18" ry="4" fill="#8B4513" opacity="0.3"/>
      <path d="M-15 8 Q-15 15 0 15 Q15 15 15 8 L12 4 L-12 4 Z" fill="url(#brassGold)"/>
      <ellipse cx="0" cy="4" rx="10" ry="2" fill="#CD853F"/>
      <ellipse cx="0" cy="4" rx="8" ry="1.5" fill="#B8860B" opacity="0.6"/>
      <line x1="0" y1="2" x2="0" y2="-6" stroke="#4A3728" stroke-width="1.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="-10" rx="6" ry="8" fill="#FF6B00" opacity="0.15" filter="url(#softGlow)"/>
      <path d="M0 -16 Q-5 -10 -4 -6 Q4 -6 0 -16Z" fill="#FF8C00"/>
      <path d="M0 -12 Q-3 -8 -2 -5 Q2 -5 0 -12Z" fill="#FFD700"/>
      <ellipse cx="0" cy="-8" rx="1" ry="2" fill="#FFFACD"/>
    </g>
    
    <!-- Diya 2 -->
    <g transform="translate(360, 200)">
      <ellipse cx="0" cy="15" rx="18" ry="4" fill="#8B4513" opacity="0.3"/>
      <path d="M-15 8 Q-15 15 0 15 Q15 15 15 8 L12 4 L-12 4 Z" fill="url(#brassGold)"/>
      <ellipse cx="0" cy="4" rx="10" ry="2" fill="#CD853F"/>
      <ellipse cx="0" cy="4" rx="8" ry="1.5" fill="#B8860B" opacity="0.6"/>
      <line x1="0" y1="2" x2="0" y2="-6" stroke="#4A3728" stroke-width="1.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="-10" rx="6" ry="8" fill="#FF6B00" opacity="0.15" filter="url(#softGlow)"/>
      <path d="M0 -16 Q-5 -10 -4 -6 Q4 -6 0 -16Z" fill="#FF8C00"/>
      <path d="M0 -12 Q-3 -8 -2 -5 Q2 -5 0 -12Z" fill="#FFD700"/>
      <ellipse cx="0" cy="-8" rx="1" ry="2" fill="#FFFACD"/>
    </g>
    
    <!-- Diya 3 -->
    <g transform="translate(100, 320)">
      <ellipse cx="0" cy="15" rx="18" ry="4" fill="#8B4513" opacity="0.3"/>
      <path d="M-15 8 Q-15 15 0 15 Q15 15 15 8 L12 4 L-12 4 Z" fill="url(#brassGold)"/>
      <ellipse cx="0" cy="4" rx="10" ry="2" fill="#CD853F"/>
      <ellipse cx="0" cy="4" rx="8" ry="1.5" fill="#B8860B" opacity="0.6"/>
      <line x1="0" y1="2" x2="0" y2="-6" stroke="#4A3728" stroke-width="1.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="-10" rx="6" ry="8" fill="#FF6B00" opacity="0.15" filter="url(#softGlow)"/>
      <path d="M0 -16 Q-5 -10 -4 -6 Q4 -6 0 -16Z" fill="#FF8C00"/>
      <path d="M0 -12 Q-3 -8 -2 -5 Q2 -5 0 -12Z" fill="#FFD700"/>
      <ellipse cx="0" cy="-8" rx="1" ry="2" fill="#FFFACD"/>
    </g>
    
    <!-- Diya 4 -->
    <g transform="translate(300, 320)">
      <ellipse cx="0" cy="15" rx="18" ry="4" fill="#8B4513" opacity="0.3"/>
      <path d="M-15 8 Q-15 15 0 15 Q15 15 15 8 L12 4 L-12 4 Z" fill="url(#brassGold)"/>
      <ellipse cx="0" cy="4" rx="10" ry="2" fill="#CD853F"/>
      <ellipse cx="0" cy="4" rx="8" ry="1.5" fill="#B8860B" opacity="0.6"/>
      <line x1="0" y1="2" x2="0" y2="-6" stroke="#4A3728" stroke-width="1.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="-10" rx="6" ry="8" fill="#FF6B00" opacity="0.15" filter="url(#softGlow)"/>
      <path d="M0 -16 Q-5 -10 -4 -6 Q4 -6 0 -16Z" fill="#FF8C00"/>
      <path d="M0 -12 Q-3 -8 -2 -5 Q2 -5 0 -12Z" fill="#FFD700"/>
      <ellipse cx="0" cy="-8" rx="1" ry="2" fill="#FFFACD"/>
    </g>
  </g>
  
  <!-- Aarti Thali -->
  <g transform="translate(200, 380)">
    <ellipse cx="0" cy="8" rx="50" ry="4" fill="#000" opacity="0.1"/>
    <ellipse cx="0" cy="0" rx="50" ry="8" fill="url(#brassGold)"/>
    <ellipse cx="0" cy="0" rx="45" ry="6" fill="none" stroke="url(#brassGold)" stroke-width="1" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="35" ry="4" fill="none" stroke="url(#brassGold)" stroke-width="1" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="15" ry="2" fill="url(#brassGold)" opacity="0.3"/>
    
    <!-- Diya on thali -->
    <g transform="translate(25, -5)" fill="url(#brassGold)">
      <ellipse cx="0" cy="5" rx="8" ry="2" fill="#8B4513" opacity="0.3"/>
      <path d="M-7 3 Q-7 5 0 5 Q7 5 7 3 L6 1 L-6 1 Z" fill="url(#brassGold)"/>
      <ellipse cx="0" cy="1" rx="5" ry="0.8" fill="#CD853F"/>
      <ellipse cx="0" cy="1" rx="4" ry="0.5" fill="#B8860B" opacity="0.6"/>
      <line x1="0" y1="0" x2="0" y2="-4" stroke="#4A3728" stroke-width="1" stroke-linecap="round"/>
      <ellipse cx="0" cy="-5" rx="3" ry="4" fill="#FF6B00" opacity="0.2"/>
      <path d="M0 -8 Q-2 -5 -1 -3 Q1 -3 0 -8Z" fill="#FF8C00"/>
      <path d="M0 -6 Q-1 -4 -0.5 -2 Q0.5 -2 0 -6Z" fill="#FFD700"/>
    </g>
    
    <!-- Kumkum on thali -->
    <ellipse cx="-30" cy="0" rx="6" ry="2" fill="#DC2626" opacity="0.8"/>
    <ellipse cx="-30" cy="0" rx="4" ry="1" fill="#EF4444" opacity="0.6"/>
    
    <!-- Rice on thali -->
    <g fill="#FEF3C7" opacity="0.9">
      <ellipse cx="30" cy="0" rx="2" ry="1"/>
      <ellipse cx="33" cy="-1" rx="1.5" ry="0.8"/>
      <ellipse cx="27" cy="1" rx="2" ry="1"/>
      <ellipse cx="36" cy="1" rx="1.5" ry="0.8"/>
    </g>
  </g>
  
  <!-- Floating sparkles -->
  <g fill="#D4A017" opacity="0.5">
    <g transform="translate(60, 40)"><path d="M0 -6 L1 -2 L6 -2 L2 1 L3 6 L0 3 L-3 6 L-2 1 L-6 -2 L-1 -2 Z" className="animate-shimmer"/></g>
    <g transform="translate(340, 50)" style="animation-delay: 0.3s"><path d="M0 -5 L0.5 -1.5 L3 -1.5 L1 0 L1.5 2.5 L0 1.5 L-1.5 2.5 L-1 0 L-3 -1.5 L-0.5 -1.5 Z" className="animate-shimmer"/></g>
    <g transform="translate(50, 350)" style="animation-delay: 0.6s"><path d="M0 -4 L0.5 -1 L2.5 -1 L0.8 0 L1 2 L0 1.5 L-1 2 L-0.8 0 L-2.5 -1 L-0.5 -1 Z" className="animate-shimmer"/></g>
    <g transform="translate(350, 350)" style="animation-delay: 0.9s"><path d="M0 -7 L1 -2.5 L5 -2.5 L2 0.5 L3 3.5 L0 2 L-3 3.5 L-2 0.5 L-5 -2.5 L-1 -2.5 Z" className="animate-shimmer"/></g>
  </g>
</svg>