<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ganeshBg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stopColor="#FDF8EF"/><stop offset="0.3" stopColor="#FEF3C7"/><stop offset="0.7" stopColor="#FFF7ED"/><stop offset="1" stopColor="#FFFBEB"/>
    </linearGradient>
    <linearGradient id="brassGold" x1="0" y1="0" x2="0" y2="1">
      <stop stopColor="#D4A017"/><stop offset="1" stopColor="#B8860B"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#ganeshBg)"/>
  <g opacity="0.08" stroke="#D4A017" stroke-width="0.4" fill="none">
    <circle cx="200" cy="200" r="160"/><circle cx="200" cy="200" r="120"/><circle cx="200" cy="200" r="80"/>
  </g>
  <!-- Ganesh Idol -->
  <g transform="translate(200, 280)">
    <ellipse cx="0" cy="30" rx="60" ry="10" fill="#000" opacity="0.08"/>
    <ellipse cx="0" cy="18" rx="65" ry="10" fill="url(#brassGold)"/>
    <path d="M-65 18 L-65 0 L65 0 L65 18 Z" fill="url(#brassGold)"/>
    <path d="M-60 15 L-60 -5 L60 -5 L60 15 Z" fill="#FEF3C7"/>
    <!-- Body -->
    <path d="M-30 40 Q-30 0 0 -15 Q30 0 30 40 L25 40 Q25 5 0 -10 Q-25 5 -25 40 Z" fill="#FEF3C7"/>
    <!-- Dhoti -->
    <path d="M-25 40 Q-25 20 0 15 Q25 20 25 40 L20 40 Q20 25 0 20 Q-20 25 -20 40 Z" fill="#DC2626" opacity="0.8"/>
    <path d="M-20 40 Q-20 25 0 20 Q20 25 20 40" fill="none" stroke="url(#brassGold)" stroke-width="1"/>
    <!-- Elephant head -->
    <ellipse cx="0" cy="-15" rx="28" ry="22" fill="#FEF3C7"/>
    <ellipse cx="0" cy="-15" rx="28" ry="22" fill="none" stroke="url(#brassGold)" stroke-width="1.5"/>
    <!-- Trunk -->
    <path d="M0 0 Q0 8 -10 18 Q-12 22 -7 28 Q0 30 7 28 Q12 22 10 18 Q0 8 0 0" fill="#FEF3C7" stroke="url(#brassGold)" stroke-width="1.5"/>
    <ellipse cx="0" cy="28" rx="5" ry="3" fill="#DC2626" opacity="0.8"/>
    <!-- Eyes -->
    <ellipse cx="-10" cy="-20" rx="5" ry="4" fill="#1C1917"/>
    <ellipse cx="10" cy="-20" rx="5" ry="4" fill="#1C1917"/>
    <circle cx="-9" cy="-21" r="2" fill="#FEF3C7"/>
    <circle cx="11" cy="-21" r="2" fill="#FEF3C7"/>
    <!-- Ears -->
    <ellipse cx="-30" cy="-15" rx="10" ry="15" fill="#FEF3C7" stroke="url(#brassGold)" stroke-width="1"/>
    <ellipse cx="30" cy="-15" rx="10" ry="15" fill="#FEF3C7" stroke="url(#brassGold)" stroke-width="1"/>
    <!-- Crown -->
    <path d="M-25 -40 Q-30 -55 -15 -62 Q0 -68 15 -62 Q30 -55 25 -40" fill="url(#brassGold)"/>
    <circle cx="0" cy="-65" r="5" fill="#DC2626" opacity="0.9"/>
    <!-- Tilak -->
    <path d="M0 -32 Q-4 -26 -4 -22 Q4 -22 4 -26 Q4 -32 0 -32Z" fill="#DC2626"/>
    <!-- Arms -->
    <path d="M-30 10 Q-40 0 -50 5" fill="none" stroke="#FEF3C7" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 10 Q40 0 50 5" fill="none" stroke="#FEF3C7" stroke-width="8" stroke-linecap="round"/>
    <path d="M-28 5 Q-35 -5 -40 -5" fill="none" stroke="#FEF3C7" stroke-width="8" stroke-linecap="round"/>
    <path d="M28 5 Q35 -5 40 -5" fill="none" stroke="#FEF3C7" stroke-width="8" stroke-linecap="round"/>
    <!-- Axe and rope in hands -->
    <g stroke="url(#brassGold)" stroke-width="2" stroke-linecap="round">
      <line x1="-50" y1="5" x2="-45" y2="15"/><line x1="-50" y1="5" x2="-55" y2="15"/>
    </g>
    <g fill="url(#brassGold)" opacity="0.8">
      <circle cx="40" cy="-5" r="3"/>
    </g>
  </g>
  <!-- Modak on left -->
  <g transform="translate(80, 200)">
    <ellipse cx="0" cy="15" rx="35" ry="7" fill="#000" opacity="0.08"/>
    <g fill="#D97706" opacity="0.85">
      <ellipse cx="0" cy="0" rx="30" ry="20" transform="rotate(-10)"/>
      <ellipse cx="0" cy="-2" rx="28" ry="18" fill="none" stroke="#FBBF24" stroke-width="1.5" opacity="0.5"/>
      <path d="M-25 0 Q-20 -10 0 -15 Q20 -10 25 0" fill="none" stroke="#FBBF24" stroke-width="1.5" opacity="0.5"/>
      <ellipse cx="0" cy="5" rx="8" ry="4" fill="#B45309" opacity="0.5"/>
    </g>
    <text x="0" y="37" text-anchor="middle" font-size="14" fill="#D4A017" font-weight="600">Modak</text>
  </g>
  <!-- Puja book on right -->
  <g transform="translate(300, 180)">
    <rect x="-25" y="-35" width="50" height="45" rx="2" fill="#7F1D1D"/>
    <rect x="-22" y="-32" width="44" height="39" rx="1" fill="#DC2626" opacity="0.3"/>
    <text x="0" y="-5" text-anchor="middle" font-size="16" fill="url(#brassGold)" font-weight="bold">ॐ</text>
    <text x="0" y="8" text-anchor="middle" font-size="8" fill="url(#brassGold)">Aarti</text>
    <rect x="-25" y="-35" width="50" height="45" rx="2" fill="none" stroke="url(#brassGold)" stroke-width="2"/>
  </g>
  <!-- Flower garland -->
  <g transform="translate(200, 60)">
    <g fill="#FF8C00" opacity="0.6">
      <circle cx="-100" cy="0" r="6"/><circle cx="-80" cy="3" r="5"/><circle cx="-60" cy="0" r="6"/>
      <circle cx="-40" cy="3" r="5"/><circle cx="-20" cy="0" r="6"/><circle cx="0" cy="3" r="5"/>
      <circle cx="20" cy="0" r="6"/><circle cx="40" cy="3" r="5"/><circle cx="60" cy="0" r="6"/>
      <circle cx="80" cy="3" r="5"/><circle cx="100" cy="0" r="6"/>
    </g>
    <g fill="#FFD700" opacity="0.7">
      <circle cx="-100" cy="0" r="3"/><circle cx="-80" cy="3" r="3"/><circle cx="-60" cy="0" r="3"/>
      <circle cx="-40" cy="3" r="3"/><circle cx="-20" cy="0" r="3"/><circle cx="0" cy="3" r="3"/>
      <circle cx="20" cy="0" r="3"/><circle cx="40" cy="3" r="3"/><circle cx="60" cy="0" r="3"/>
      <circle cx="80" cy="3" r="3"/><circle cx="100" cy="0" r="3"/>
    </g>
  </g>
  <!-- Sparkles -->
  <g fill="#D4A017" opacity="0.5">
    <g transform="translate(50, 50)"><path d="M0 -6 L1 -2 L6 -2 L2 1 L3 6 L0 3 L-3 6 L-2 1 L-6 -2 L-1 -2 Z" className="animate-shimmer"/></g>
    <g transform="translate(350, 350)" style="animation-delay:0.3s"><path d="M0 -5 L0.5 -1.5 L3 -1.5 L1 0 L1.5 2.5 L0 1.5 L-1.5 2.5 L-1 0 L-3 -1.5 L-0.5 -1.5 Z" className="animate-shimmer"/></g>
    <g transform="translate(300, 60)" style="animation-delay:0.6s"><path d="M0 -4 L0.5 -1 L2.5 -1 L0.8 0 L1 2 L0 1.5 L-1 2 L-0.8 0 L-2.5 -1 L-0.5 -1 Z" className="animate-shimmer"/></g>
  </g>
</svg>