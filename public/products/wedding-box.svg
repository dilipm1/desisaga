<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="weddingGold" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stopColor="#D4A017"/>
      <stop offset="0.5" stopColor="#F59E0B"/>
      <stop offset="1" stopColor="#EA580C"/>
    </linearGradient>
    <linearGradient id="brassGold" x1="0" y1="0" x2="0" y2="1">
      <stop stopColor="#D4A017"/>
      <stop offset="1" stopColor="#B8860B"/>
    </linearGradient>
    <linearGradient id="deepRed" x1="0" y1="0" x2="0" y2="1">
      <stop stopColor="#7F1D1D"/>
      <stop offset="1" stopColor="#991B1B"/>
    </linearGradient>
    <radialGradient id="pearlGlow" cx="50%" cy="50%" r="50%">
      <stop stopColor="#FEF3C7" stopOpacity="0.9"/>
      <stop offset="1" stopColor="#D4A017" stopOpacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="paisleyPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 Q20 10 30 20 Q10 30 20 40 Q30 30 20 20 Q10 10 20 0" fill="none" stroke="url(#brassGold)" stroke-width="0.3" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#weddingGold)" opacity="0.05"/>
  <rect width="400" height="400" fill="url(#paisleyPattern)"/>
  
  <!-- Main gift box -->
  <g transform="translate(200, 250)">
    <!-- Box shadow -->
    <ellipse cx="0" cy="20" rx="110" ry="14" fill="#000" opacity="0.12"/>
    
    <!-- Box base (deep red) -->
    <path d="M-120 0 L-120 -100 L120 -100 L120 0 Z" fill="url(#deepRed)"/>
    <path d="M-120 -100 L-120 0 L-100 0 L-100 -100 Z" fill="#7F1D1D" opacity="0.6"/>
    <path d="M120 -100 L120 0 L100 0 L100 -100 Z" fill="#DC2626" opacity="0.4"/>
    
    <!-- Box lid -->
    <path d="M-130 -100 L-10 -110 L10 -110 L130 -100 L120 0 L-120 0 Z" fill="url(#deepRed)"/>
    <path d="M-130 -100 L-10 -110 L-120 0 L-130 0 Z" fill="#7F1D1D" opacity="0.5"/>
    
    <!-- Gold trim on box -->
    <path d="M-120 -100 L-10 -110 L10 -110 L120 -100" fill="none" stroke="url(#brassGold)" stroke-width="2.5"/>
    <path d="M-10 -110 L-120 0" fill="none" stroke="url(#brassGold)" stroke-width="2.5"/>
    <path d="M10 -110 L120 0" fill="none" stroke="url(#brassGold)" stroke-width="2.5"/>
    
    <!-- Intricate paisley design on box -->
    <g fill="url(#brassGold)" opacity="0.85" filter="url(#softGlow)">
      <path d="M-80 -60 Q-70 -50 -60 -60 Q-50 -70 -60 -60 Q-70 -50 -80 -60Z" transform="rotate(-15 -80 -60)"/>
      <path d="M80 -60 Q90 -50 100 -60 Q110 -70 100 -60 Q90 -50 80 -60Z" transform="rotate(15 80 -60)"/>
      <path d="M0 -75 Q10 -65 20 -75 Q30 -85 20 -75 Q10 -65 0 -75Z"/>
      <path d="M-40 -60 Q-35 -55 -30 -60 Q-25 -65 -30 -60 Q-35 -55 -40 -60Z"/>
      <path d="M40 -60 Q45 -55 50 -60 Q55 -65 50 -60 Q45 -55 40 -60Z"/>
      
      <!-- Small decorative dots -->
      <circle cx="-90" cy="-50" r="3"/>
      <circle cx="90" cy="-50" r="3"/>
      <circle cx="0" cy="-85" r="3"/>
      <circle cx="-60" cy="-40" r="2.5"/>
      <circle cx="60" cy="-40" r="2.5"/>
    </g>
    
    <!-- Gold ribbon -->
    <rect x="-10" y="-100" width="20" height="100" fill="url(#brassGold)" opacity="0.95"/>
    <ellipse cx="0" cy="-100" rx="20" ry="10" fill="url(#brassGold)" opacity="0.95"/>
    
    <!-- Bow on top -->
    <g fill="url(#brassGold)" opacity="0.95">
      <ellipse cx="-25" cy="-105" rx="15" ry="10" transform="rotate(-35 -25 -105)"/>
      <ellipse cx="25" cy="-105" rx="15" ry="10" transform="rotate(35 25 -105)"/>
      <circle cx="0" cy="-105" r="8"/>
      <ellipse cx="-25" cy="-95" rx="8" ry="5" fill="#FEF3C7" opacity="0.6" transform="rotate(-35 -25 -95)"/>
      <ellipse cx="25" cy="-95" rx="8" ry="5" fill="#FEF3C7" opacity="0.6" transform="rotate(35 25 -95)"/>
    </g>
    
    <!-- Side ribbons -->
    <path d="M-20 -100 Q-40 -90 -45 -60 Q-40 -30 -20 -10" fill="none" stroke="url(#brassGold)" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    <path d="M20 -100 Q40 -90 45 -60 Q40 -30 20 -10" fill="none" stroke="url(#brassGold)" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
  </g>
  
  <!-- Mangalsutra -->
  <g transform="translate(120, 100)">
    <!-- Black beads chain -->
    <g fill="#1C1917">
      <circle cx="0" cy="0" r="5"/>
      <circle cx="14" cy="0" r="5"/>
      <circle cx="28" cy="0" r="5"/>
      <circle cx="42" cy="0" r="5"/>
      <circle cx="56" cy="0" r="5"/>
      <circle cx="70" cy="0" r="5"/>
      <circle cx="84" cy="0" r="5"/>
      <circle cx="98" cy="0" r="5"/>
      <circle cx="112" cy="0" r="5"/>
      <circle cx="126" cy="0" r="5"/>
    </g>
    <!-- Gold spacers -->
    <g fill="url(#brassGold)">
      <circle cx="7" cy="0" r="3.5"/>
      <circle cx="21" cy="0" r="3.5"/>
      <circle cx="35" cy="0" r="3.5"/>
      <circle cx="49" cy="0" r="3.5"/>
      <circle cx="63" cy="0" r="3.5"/>
      <circle cx="77" cy="0" r="3.5"/>
      <circle cx="91" cy="0" r="3.5"/>
      <circle cx="105" cy="0" r="3.5"/>
      <circle cx="119" cy="0" r="3.5"/>
    </g>
    <!-- Central pendant -->
    <g transform="translate(63, 25)" fill="url(#brassGold)" filter="url(#softGlow)">
      <circle cx="0" cy="0" r="18"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="url(#brassGold)" stroke-width="2" opacity="0.5"/>
      <path d="M0 -8 Q-5 -2 -5 2 Q-5 6 0 10 Q5 6 5 2 Q5 -2 0 -8Z" fill="#7F1D1D"/>
      <circle cx="0" cy="0" r="4" fill="#FEF3C7" opacity="0.8"/>
    </g>
  </g>
  
  <!-- Sindoor box -->
  <g transform="translate(300, 100)">
    <ellipse cx="0" cy="15" rx="25" ry="6" fill="#000" opacity="0.1"/>
    <ellipse cx="0" cy="0" rx="25" ry="5" fill="url(#brassGold)"/>
    <ellipse cx="0" cy="0" rx="20" ry="4" fill="none" stroke="url(#brassGold)" stroke-width="1.5" opacity="0.5"/>
    <!-- Lid -->
    <ellipse cx="0" cy="-25" rx="25" ry="5" fill="url(#brassGold)"/>
    <ellipse cx="0" cy="-25" rx="20" ry="4" fill="none" stroke="url(#brassGold)" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="0" cy="-25" rx="15" ry="3" fill="url(#brassGold)"/>
    <!-- Sindoor (red powder) visible -->
    <ellipse cx="0" cy="-5" rx="18" ry="3" fill="#DC2626" opacity="0.9"/>
    <ellipse cx="0" cy="-5" rx="15" ry="2" fill="#EF4444" opacity="0.6"/>
    <!-- Knob on lid -->
    <circle cx="0" cy="-30" r="5" fill="url(#brassGold)"/>
    <circle cx="0" cy="-30" r="3" fill="#FEF3C7" opacity="0.7"/>
  </g>
  
  <!-- Shagun envelope -->
  <g transform="translate(50, 100)">
    <path d="M-35 -30 L-35 20 L35 20 L35 -30 Z" fill="#7F1D1D"/>
    <path d="M-35 -30 L-35 20 L-25 20 L-25 -30 Z" fill="#991B1B" opacity="0.5"/>
    <path d="M35 -30 L35 20 L25 20 L25 -30 Z" fill="#DC2626" opacity="0.4"/>
    <!-- Flap -->
    <path d="M-35 -30 L0 -45 L35 -30 L35 -20 L-35 -20 Z" fill="url(#deepRed)"/>
    <path d="M-35 -30 L0 -45 L-25 -20 Z" fill="#991B1B" opacity="0.5"/>
    <!-- Gold border -->
    <path d="M-35 -30 L0 -45 L35 -30 L35 20 L-35 20 Z" fill="none" stroke="url(#brassGold)" stroke-width="2"/>
    <!-- Om symbol on envelope -->
    <text x="0" y="-5" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="url(#brassGold)" opacity="0.9">ॐ</text>
  </g>
  
  <!-- Dry fruits box -->
  <g transform="translate(200, 80)">
    <ellipse cx="0" cy="10" rx="30" ry="5" fill="#000" opacity="0.1"/>
    <path d="M-35 -20 L-35 10 L35 10 L35 -20 Z" fill="#FEF3C7"/>
    <path d="M-35 -20 L-35 10 L-25 10 L-25 -20 Z" fill="#FDE68A"/>
    <path d="M35 -20 L35 10 L25 10 L25 -20 Z" fill="#FEF3C7" opacity="0.7"/>
    <path d="M-35 -20 L35 -20 L35 -30 L-35 -30 Z" fill="#FEF3C7"/>
    <path d="M-35 -30 L35 -30 L30 -38 L-30 -38 Z" fill="#FDE68A"/>
    <!-- Nuts inside -->
    <g fill="#D97706" opacity="0.8">
      <ellipse cx="-20" cy="-5" rx="7" ry="4"/>
      <ellipse cx="0" cy="-5" rx="6" ry="3.5"/>
      <ellipse cx="20" cy="-5" rx="7" ry="4"/>
      <ellipse cx="-10" cy="5" rx="6" ry="3.5"/>
      <ellipse cx="10" cy="5" rx="7" ry="4"/>
    </g>
    <g fill="#FBBF24" opacity="0.5">
      <ellipse cx="-20" cy="-5" rx="3" ry="2"/>
      <ellipse cx="0" cy="-5" rx="3" ry="2"/>
      <ellipse cx="20" cy="-5" rx="3" ry="2"/>
      <ellipse cx="-10" cy="5" rx="3" ry="2"/>
      <ellipse cx="10" cy="5" rx="3" ry="2"/>
    </g>
    <path d="M-35 -20 L-35 10 L35 10 L35 -20 Z" fill="none" stroke="url(#brassGold)" stroke-width="1.5"/>
    <path d="M-35 -20 L35 -20 L35 -30 L-35 -30 Z" fill="none" stroke="url(#brassGold)" stroke-width="1.5"/>
  </g>
  
  <!-- Photo frame -->
  <g transform="translate(350, 220)">
    <ellipse cx="0" cy="12" rx="28" ry="6" fill="#000" opacity="0.1"/>
    <rect x="-30" y="-35" width="60" height="50" rx="4" fill="url(#brassGold)"/>
    <rect x="-25" y="-30" width="50" height="40" rx="2" fill="#1C1917"/>
    <rect x="-23" y="-28" width="46" height="36" rx="1" fill="#7F1D1D" opacity="0.3"/>
    <!-- Photo placeholder -->
    <rect x="-20" y="-25" width="40" height="30" rx="1" fill="none" stroke="url(#brassGold)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
    <text x="0" y="-5" text-anchor="middle" font-size="10" fill="url(#brassGold)" opacity="0.4">Photo</text>
    <!-- Decorative corners -->
    <g fill="url(#brassGold)">
      <path d="M-28 -33 L-20 -33 L-28 -25 Z"/>
      <path d="M28 -33 L20 -33 L28 -25 Z"/>
      <path d="M-28 13 L-20 13 L-28 5 Z"/>
      <path d="M28 13 L20 13 L28 5 Z"/>
    </g>
  </g>
  
  <!-- Floating sparkles -->
  <g fill="#D4A017" opacity="0.5">
    <g transform="translate(80, 300)"><path d="M0 -6 L1 -2 L6 -2 L2 1 L3 6 L0 3 L-3 6 L-2 1 L-6 -2 L-1 -2 Z" className="animate-shimmer"/></g>
    <g transform="translate(320, 320)"><path d="M0 -5 L0.5 -1.5 L3 -1.5 L1 0 L1.5 2.5 L0 1.5 L-1.5 2.5 L-1 0 L-3 -1.5 L-0.5 -1.5 Z" className="animate-shimmer" style="animation-delay: 0.3s"/></g>
    <g transform="translate(60, 50)"><path d="M0 -4 L0.5 -1 L2.5 -1 L0.8 0 L1 2 L0 1.5 L-1 2 L-0.8 0 L-2.5 -1 L-0.5 -1 Z" className="animate-shimmer" style="animation-delay: 0.6s"/></g>
    <g transform="translate(340, 60)"><path d="M0 -7 L1 -2.5 L5 -2.5 L2 0.5 L3 3.5 L0 2 L-3 3.5 L-2 0.5 L-5 -2.5 L-1 -2.5 Z" className="animate-shimmer" style="animation-delay: 0.9s"/></g>
  </g>
</svg>