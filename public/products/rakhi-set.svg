<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rakhiGold" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stopColor="#D4A017"/><stop offset="0.5" stopColor="#F59E0B"/><stop offset="1" stopColor="#EA580C"/>
    </linearGradient>
    <linearGradient id="brassGold" x1="0" y1="0" x2="0" y2="1">
      <stop stopColor="#D4A017"/><stop offset="1" stopColor="#B8860B"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#rakhiGold)" opacity="0.04"/>
  <g opacity="0.08" transform="translate(200,200)" fill="none" stroke="#D4A017" stroke-width="0.5">
    <circle cx="0" cy="0" r="160"/><circle cx="0" cy="0" r="130"/>
    <circle cx="0" cy="0" r="90"/><circle cx="0" cy="0" r="50"/>
  </g>
  <!-- Rakhi main -->
  <g transform="translate(200, 220)">
    <ellipse cx="0" cy="20" rx="90" ry="12" fill="#000" opacity="0.08"/>
    <path d="M-100 -10 Q-120 -50 -80 -70 Q-40 -90 0 -70 Q40 -90 80 -70 Q120 -50 100 -10 Q80 20 60 40 Q40 60 0 70 Q-40 60 -60 40 Q-80 20 -100 -10Z" fill="none" stroke="url(#brassGold)" stroke-width="3"/>
    <!-- Silk threads -->
    <g stroke="#D4A017" stroke-width="1.5" opacity="0.6">
      <path d="M-90 -5 Q-110 -40 -80 -55" fill="none"/>
      <path d="M90 -5 Q110 -40 80 -55" fill="none"/>
      <path d="M-85 5 Q-100 20 -70 35" fill="none"/>
      <path d="M85 5 Q100 20 70 35" fill="none"/>
    </g>
    <!-- Thread strands -->
    <g fill="none" stroke-linecap="round">
      <path d="M0 -70 Q-15 -50 -20 -30" stroke="#FF6B00" stroke-width="2" opacity="0.5"/>
      <path d="M0 -70 Q15 -50 20 -30" stroke="#FF6B00" stroke-width="2" opacity="0.5"/>
      <path d="M-20 -30 Q-30 -10 -35 10" stroke="#F59E0B" stroke-width="2" opacity="0.5"/>
      <path d="M20 -30 Q30 -10 35 10" stroke="#F59E0B" stroke-width="2" opacity="0.5"/>
      <path d="M-35 10 Q-40 30 -45 50" stroke="#DC2626" stroke-width="2" opacity="0.4"/>
      <path d="M35 10 Q40 30 45 50" stroke="#DC2626" stroke-width="2" opacity="0.4"/>
    </g>
    <!-- Central medallion -->
    <g filter="url(#softGlow)">
      <circle cx="0" cy="-10" r="45" fill="url(#brassGold)"/>
      <circle cx="0" cy="-10" r="38" fill="none" stroke="#D4A017" stroke-width="2" opacity="0.5"/>
      <circle cx="0" cy="-10" r="30" fill="url(#brassGold)" opacity="0.8"/>
      <circle cx="0" cy="-10" r="22" fill="#DC2626" opacity="0.85"/>
      <circle cx="0" cy="-10" r="15" fill="url(#brassGold)"/>
      <circle cx="0" cy="-10" r="8" fill="#DC2626" opacity="0.9"/>
      <circle cx="0" cy="-10" r="4" fill="url(#brassGold)"/>
      <!-- Om symbol -->
      <text x="0" y="-5" text-anchor="middle" font-family="serif" font-size="22" font-weight="bold" fill="#FEF3C7" opacity="0.95">ॐ</text>
    </g>
    <!-- Decorative dots around medallion -->
    <g fill="url(#brassGold)" opacity="0.7">
      <circle cx="0" cy="-58" r="3"/><circle cx="42" cy="-45" r="3"/><circle cx="52" cy="-10" r="3"/>
      <circle cx="42" cy="25" r="3"/><circle cx="0" cy="38" r="3"/><circle cx="-42" cy="25" r="3"/>
      <circle cx="-52" cy="-10" r="3"/><circle cx="-42" cy="-45" r="3"/>
    </g>
  </g>
  <!-- Roli chawal container -->
  <g transform="translate(80, 100)">
    <ellipse cx="0" cy="15" rx="25" ry="6" fill="#000" opacity="0.1"/>
    <ellipse cx="0" cy="0" rx="28" ry="7" fill="url(#brassGold)"/>
    <ellipse cx="0" cy="0" rx="24" ry="5" fill="none" stroke="url(#brassGold)" stroke-width="1.5" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="20" ry="4" fill="#FEF3C7"/>
    <ellipse cx="0" cy="-3" rx="10" ry="2" fill="#DC2626" opacity="0.8"/>
    <ellipse cx="0" cy="-3" rx="7" ry="1.5" fill="#EF4444" opacity="0.6"/>
    <ellipse cx="0" cy="-28" rx="28" ry="7" fill="url(#brassGold)"/>
    <ellipse cx="0" cy="-25" rx="24" ry="5" fill="none" stroke="url(#brassGold)" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="-32" r="6" fill="url(#brassGold)"/>
    <circle cx="0" cy="-32" r="4" fill="#FEF3C7" opacity="0.7"/>
  </g>
  <!-- Chocolate box -->
  <g transform="translate(320, 120)">
    <ellipse cx="0" cy="12" rx="28" ry="6" fill="#000" opacity="0.1"/>
    <path d="M-32 -20 L-32 12 L32 12 L32 -20 Z" fill="#4A3728"/>
    <path d="M-32 -20 L-32 12 L-22 12 L-22 -20 Z" fill="#5D4037" opacity="0.5"/>
    <path d="M-32 -20 L32 -20 L32 -28 L-32 -28 Z" fill="url(#brassGold)"/>
    <path d="M-32 -28 L32 -28 L27 -35 L-27 -35 Z" fill="url(#brassGold)"/>
    <rect x="-20" y="-10" width="40" height="15" rx="3" fill="#3B82F6" opacity="0.3"/>
    <text x="0" y="-2" text-anchor="middle" font-size="8" fill="url(#brassGold)" font-weight="bold">Chocolates</text>
    <path d="M-32 -20 L-32 12 L32 12 L32 -20 Z" fill="none" stroke="url(#brassGold)" stroke-width="1.5"/>
  </g>
  <!-- Sparkles -->
  <g fill="#D4A017" opacity="0.5">
    <g transform="translate(60, 320)"><path d="M0 -6 L1 -2 L6 -2 L2 1 L3 6 L0 3 L-3 6 L-2 1 L-6 -2 L-1 -2 Z" className="animate-shimmer"/></g>
    <g transform="translate(340, 340)" style="animation-delay:0.3s"><path d="M0 -5 L0.5 -1.5 L3 -1.5 L1 0 L1.5 2.5 L0 1.5 L-1.5 2.5 L-1 0 L-3 -1.5 L-0.5 -1.5 Z" className="animate-shimmer"/></g>
    <g transform="translate(40, 60)" style="animation-delay:0.6s"><path d="M0 -4 L0.5 -1 L2.5 -1 L0.8 0 L1 2 L0 1.5 L-1 2 L-0.8 0 L-2.5 -1 L-0.5 -1 Z" className="animate-shimmer"/></g>
  </g>
</svg>