<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pujaBg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDF8EF"/>
      <stop offset="0.3" stop-color="#FEF3C7"/>
      <stop offset="0.7" stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#FFFBEB"/>
    </linearGradient>
    <linearGradient id="brassGold" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D4A017"/>
      <stop offset="0.3" stop-color="#B8860B"/>
      <stop offset="0.7" stop-color="#CD853F"/>
      <stop offset="1" stop-color="#8B7355"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CD7F32"/>
      <stop offset="1" stop-color="#B87333"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" fill="url(#pujaBg)"/>
  
  <!-- Decorative border pattern -->
  <g stroke="#D4A017" stroke-width="0.5" opacity="0.15" fill="none">
    <rect x="20" y="20" width="360" height="360" rx="20"/>
    <rect x="40" y="40" width="320" height="320" rx="15"/>
  </g>
  
  <!-- Floating sparkles -->
  <g fill="#D4A017">
    <circle cx="60" cy="60" r="1.5" opacity="0.6"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="80" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="340" r="1.5" opacity="0.6"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="350" r="1" opacity="0.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  
  <!-- Main Puja Thali (center) -->
  <g transform="translate(200, 220)">
    <!-- Thali shadow -->
    <ellipse cx="0" cy="25" rx="100" ry="8" fill="#000" opacity="0.1"/>
    
    <!-- Thali base -->
    <ellipse cx="0" cy="0" rx="110" ry="15" fill="url(#brassGold)"/>
    <ellipse cx="0" cy="0" rx="100" ry="12" fill="#FEF3C7"/>
    <ellipse cx="0" cy="0" rx="95" ry="10" fill="url(#brassGold)"/>
    
    <!-- Thali rim decoration -->
    <g stroke="#B8860B" stroke-width="1.5" fill="none">
      <ellipse cx="0" cy="0" rx="90" ry="8"/>
      <ellipse cx="0" cy="0" rx="80" ry="6"/>
    </g>
    
    <!-- Items on thali -->
    <!-- Diya on thali -->
    <g transform="translate(-50, -30)">
      <path d="M-12 8 Q-12 15 0 15 Q12 15 12 8 L10 5 L-10 5 Z" fill="url(#brassGold)"/>
      <ellipse cx="0" cy="4" rx="7" ry="1.5" fill="#B8860B" opacity="0.6"/>
      <line x1="0" y1="2" x2="0" y2="-5" stroke="#4A3728" stroke-width="1" stroke-linecap="round"/>
      <ellipse cx="0" cy="-6" rx="4" ry="6" fill="#FF8C00" opacity="0.3"/>
      <path d="M0 -10 Q-3 -6 -2 -3 Q2 -3 0 -10Z" fill="#FFD700"/>
    </g>
    
    <!-- Kumkum/Haldi containers -->
    <g transform="translate(0, -45)">
      <!-- Kumkum (red) -->
      <g transform="translate(-30, 0)">
        <ellipse cx="0" cy="8" rx="12" ry="3" fill="#D4A017" opacity="0.3"/>
        <path d="M-10 8 Q-10 15 0 15 Q10 15 10 8" fill="#FEF3C7"/>
        <ellipse cx="0" cy="5" rx="8" ry="2" fill="#DC2626" opacity="0.8"/>
        <ellipse cx="0" cy="3" rx="6" ry="1.5" fill="#EF4444" opacity="0.6"/>
      </g>
      
      <!-- Haldi (yellow) -->
      <g transform="translate(30, 0)">
        <ellipse cx="0" cy="8" rx="12" ry="3" fill="#D4A017" opacity="0.3"/>
        <path d="M-10 8 Q-10 15 0 15 Q10 15 10 8" fill="#FEF3C7"/>
        <ellipse cx="0" cy="5" rx="8" ry="2" fill="#F59E0B"/>
        <ellipse cx="0" cy="3" rx="6" ry="1.5" fill="#FBBF24" opacity="0.7"/>
      </g>
    </g>
    
    <!-- Rice grains -->
    <g transform="translate(0, -10)" fill="#FEF3C7" opacity="0.9">
      <ellipse cx="-60" cy="0" rx="3" ry="1.5"/>
      <ellipse cx="-55" cy="2" rx="2.5" ry="1.2"/>
      <ellipse cx="-50" cy="-1" rx="3" ry="1.5"/>
      <ellipse cx="50" cy="0" rx="3" ry="1.5"/>
      <ellipse cx="55" cy="2" rx="2.5" ry="1.2"/>
      <ellipse cx="60" cy="-1" rx="3" ry="1.5"/>
    </g>
    
    <!-- Incense sticks -->
    <g transform="translate(-70, -60)" fill="#CD853F">
      <rect x="-2" y="-25" width="4" height="30" rx="2"/>
      <rect x="-2" y="-25" width="4" height="8" rx="2" fill="#F59E0B" opacity="0.6"/>
    </g>
    <g transform="translate(70, -60)" fill="#CD853F">
      <rect x="-2" y="-25" width="4" height="30" rx="2"/>
      <rect x="-2" y="-25" width="4" height="8" rx="2" fill="#F59E0B" opacity="0.6"/>
    </g>
    
    <!-- Bell (ghanti) -->
    <g transform="translate(0, -80)" fill="url(#brassGold)">
      <path d="M-12 0 Q-12 -15 0 -15 Q12 -15 12 0"/>
      <ellipse cx="0" cy="-15" rx="12" ry="3" fill="url(#brassGold)"/>
      <line x1="0" y1="-15" x2="0" y2="-22" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="-22" r="3" fill="#D4A017"/>
    </g>
  </g>
  
  <!-- Coconut with red cloth -->
  <g transform="translate(320, 180)" opacity="0.8">
    <ellipse cx="0" cy="10" rx="18" ry="8" fill="#000" opacity="0.1"/>
    <path d="M-18 10 Q-18 -10 0 -20 Q18 -10 18 10 Q18 20 0 25 Q-18 20 -18 10" fill="#4A3728"/>
    <path d="M-15 8 Q-15 -5 0 -15 Q15 -5 15 8" fill="#5D4037" opacity="0.5"/>
    <!-- Red cloth -->
    <path d="M-18 10 Q-25 5 -20 0 Q-15 5 -18 10" fill="#DC2626" opacity="0.7"/>
    <path d="M18 10 Q25 5 20 0 Q15 5 18 10" fill="#DC2626" opacity="0.7"/>
  </g>
  
  <!-- Flowers -->
  <g fill="#FCE7F3" opacity="0.7">
    <g transform="translate(80, 100)">
      <circle cx="0" cy="0" r="8"/>
      <circle cx="8" cy="0" r="8"/>
      <circle cx="4" cy="-7" r="8"/>
      <circle cx="-4" cy="-7" r="8"/>
      <circle cx="-8" cy="0" r="8"/>
      <circle cx="4" cy="7" r="8"/>
      <circle cx="-4" cy="7" r="8"/>
      <circle cx="0" cy="0" r="4" fill="#F59E0B"/>
    </g>
    <g transform="translate(300, 300)" opacity="0.5">
      <circle cx="0" cy="0" r="6"/>
      <circle cx="6" cy="0" r="6"/>
      <circle cx="3" cy="-5" r="6"/>
      <circle cx="-3" cy="-5" r="6"/>
      <circle cx="-6" cy="0" r="6"/>
      <circle cx="3" cy="5" r="6"/>
      <circle cx="-3" cy="5" r="6"/>
      <circle cx="0" cy="0" r="3" fill="#F59E0B"/>
    </g>
  </g>
</svg>